<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather App</title>

  <!-- Bootstrap CSS and Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />

  <style>
    body {
      background: linear-gradient(to right, #1e3c72, #2a5298);
      height: 100vh;
      margin: 0;
    }
    .app {
      max-width: 600px;
      width: 100%;
      padding: 25px;
      background-image: url("../image/beautiful-clouds-scenery.jpg");
      background-size: cover;
      background-position: center;
      box-shadow: 0 5px 15px rgba(0,0,0,0.4);
      border-radius: 15px;
      color: rgb(35, 29, 29);
    }
    #lblTemp {
      text-shadow: 2px 2px 2px black;
    }
  </style>

  <script>
    function GetWeather(city) {
      const apiKey = "03b2bad650ea4791972165741252904"; // Your WeatherAPI.com API key
      const url = `https://api.weatherapi.com/v1/current.json?key=${apiKey}&q=${city}`;

      fetch(url)
        .then(response => response.json())
        .then(data => {
          if (data.error) {
            alert("City not found or invalid input.");
            return;
          }

          document.getElementById("detailsContainer").style.display = "block";
          document.getElementById("lblCity").innerHTML = `${data.location.name}, ${data.location.country}`;
          document.getElementById("lblTemp").innerHTML = `${data.current.temp_c} &deg;C`;
          document.getElementById("lblWind").innerHTML = `${data.current.wind_kph} km/h`;
          document.getElementById("lblHumid").innerHTML = `${data.current.humidity}%`;
          document.getElementById("lblTime").innerHTML = `Local Time: ${data.location.localtime}`;
        })
        .catch(error => {
          console.error("Error:", error);
          alert("Something went wrong.");
        });
    }

    function SearchClick() {
      const city = document.getElementById("txtCity").value;
      GetWeather(city);
      document.getElementById("lstCities").value = city;
    }

    function CityChange() {
      const city = document.getElementById("lstCities").value;
      GetWeather(city);
      document.getElementById("txtCity").value = city;
    }
  </script>
</head>
<body class="d-flex justify-content-center align-items-center">
  <div class="app">
    <div class="input-group mb-3">
      <input type="text" id="txtCity" class="form-control" placeholder="Enter city name" />
      <button onclick="SearchClick()" class="btn btn-warning">
        <i class="bi bi-search"></i>
      </button>
    </div>

    <div class="mb-4">
      <label class="form-label text-white fw-bold">Or Select City</label>
      <select id="lstCities" onchange="CityChange()" class="form-select">
        <option disabled selected>Choose City</option>
        <option>New York</option>
        <option>London</option>
        <option>Delhi</option>
        <option>Sydney</option>
        <option>Tokyo</option>
      </select>
    </div>

    <div id="detailsContainer" style="display: none;">
      <h4 id="lblCity" class="text-black fw-bold"></h4>
      <div class="mt-2">
        <span id="lblTemp" class="fs-2 text-black fw-bold"></span>
      </div>
      <div class="mt-2 text-black fs-5">
        <i class="bi bi-speedometer"></i>
        <span id="lblWind"></span>
      </div>
      <div class="mt-2 text-black fs-5">
        <i class="bi bi-thermometer"></i>
        <span id="lblHumid"></span>
      </div>
      <div class="mt-2 text-black fs-5">
        <i class="bi bi-clock-history"></i>
        <span id="lblTime"></span>
      </div>
    </div>
  </div>
</body>
</html>
